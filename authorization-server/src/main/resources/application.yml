server:
  port: 9000
  servlet:
    session:
      cookie:
        name: BIBLIOTECA_AUTH_SESSION
        http-only: true
        same-site: lax

spring:
  application:
    name: authorization-server
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

logging:
  level:
    root: WARN
    br.com.gabrielppg.authorizationserver: INFO
  file:
    name: authorization-server.log

management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,info
