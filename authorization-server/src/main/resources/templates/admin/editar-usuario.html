<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editar usuário · Administração</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head>
<body>
<header class="site-header"><strong>Biblioteca · Administração</strong><nav><a th:href="@{/admin}">Início</a><a th:href="@{/admin/usuarios}">Usuários</a><a th:href="@{/admin/clientes}">Clientes OAuth2</a></nav></header>
<main><div class="panel">
<h1>Editar usuário</h1><p class="muted">Conta <strong th:text="${origem}">Local</strong>. Senha e identificador Google permanecem inalterados.</p>
<form th:action="@{/admin/usuarios/{id}/editar(id=${idUsuario})}" th:object="${form}" method="post" autocomplete="off">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div th:if="${#fields.hasGlobalErrors()}" class="error"><p th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></p></div>
<div class="form-grid">
  <div class="field"><label for="login">Login</label><input id="login" th:field="*{login}" minlength="3" maxlength="50" required><span class="error" th:if="${#fields.hasErrors('login')}" th:errors="*{login}"></span></div>
  <div class="field"><label for="email">E-mail</label><input type="email" id="email" th:field="*{email}"><span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span></div>
  <div class="field"><label for="role">Papel</label><select id="role" th:field="*{role}"><option value="OPERADOR">OPERADOR</option><option value="GERENTE">GERENTE</option></select><span class="error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></span></div>
</div>
<p class="note">O e-mail é obrigatório para contas locais e opcional para contas exclusivamente Google. Não é permitido retirar o próprio papel GERENTE.</p>
<div class="actions"><button type="submit" class="button">Salvar alterações</button><a class="button secondary" th:href="@{/admin/usuarios}">Cancelar</a></div>
</form>
</div></main></body></html>
