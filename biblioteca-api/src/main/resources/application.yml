server:
  port: ${BIBLIOTECA_API_PORT:8080}

spring:
  application:
    name: biblioteca-api
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVER_ISSUER:http://localhost:9000}
          jwk-set-uri: ${AUTH_SERVER_JWKS_URI:http://localhost:9000/oauth2/jwks}

biblioteca:
  security:
    audience: ${BIBLIOTECA_JWT_AUDIENCE:biblioteca-api}

logging:
  level:
    root: WARN
    br.com.gabrielppg: INFO
  file:
    name: biblioteca-api.log

management:
  server:
    port: ${BIBLIOTECA_ACTUATOR_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  override-with-generic-response: false
