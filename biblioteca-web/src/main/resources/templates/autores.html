<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Biblioteca • Autores</title><link rel="stylesheet" th:href="@{/css/estilo.css}"></head>
<body>
<header class="topo"><div class="container menu"><a class="marca" th:href="@{/livros}">Biblioteca<span>WEB</span></a><nav><a th:href="@{/livros}">Livros</a><a class="ativo" th:href="@{/autores}">Autores</a></nav><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="sair" type="submit">Sair</button></form></div></header>
<main class="container pagina"><div class="cabecalho"><div><div class="etiqueta">CATÁLOGO</div><h1>Autores</h1><p>Consulte os autores cadastrados.</p></div><div class="cabecalho-acoes"><a class="botao principal" th:href="@{/autores/novo}">+ Cadastrar autor</a><span class="selo">Consulta autenticada com JWT</span></div></div>
<form class="busca busca-dois" method="get" th:action="@{/autores}"><label>Nome<input type="search" name="nome" th:value="${nome}" placeholder="Nome do autor"></label><label>Nacionalidade<input type="search" name="nacionalidade" th:value="${nacionalidade}" placeholder="Brasileiro"></label><button class="botao principal" type="submit">Pesquisar</button></form>
<div th:if="${sucesso != null}" class="sucesso" th:text="${sucesso}"></div>
    <div th:if="${erro != null}" class="erro" th:text="${erro}"></div>
<section class="tabela-wrap" th:if="${autores != null}"><div class="sumario"><strong th:text="${#lists.size(autores) + ' autor(es) encontrado(s)'}"></strong><small>Dados fornecidos pela API REST</small></div>
<table><thead><tr><th>Nome</th><th>Nacionalidade</th><th>Data de nascimento</th></tr></thead><tbody><tr th:each="autor : ${autores}"><td><strong th:text="${autor.nome}"></strong></td><td th:text="${autor.nacionalidade}"></td><td th:text="${autor.dataNascimento}"></td></tr><tr th:if="${#lists.isEmpty(autores)}"><td colspan="3" class="vazio">Nenhum autor encontrado.</td></tr></tbody></table></section>
</main></body></html>
