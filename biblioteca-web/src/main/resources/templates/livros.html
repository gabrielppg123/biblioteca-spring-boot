<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biblioteca • Livros</title><link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<header class="topo"><div class="container menu"><a class="marca" th:href="@{/livros}">Biblioteca<span>WEB</span></a><nav><a class="ativo" th:href="@{/livros}">Livros</a><a th:href="@{/autores}">Autores</a></nav><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="sair" type="submit">Sair</button></form></div></header>
<main class="container pagina">
    <div class="cabecalho"><div><div class="etiqueta">CATÁLOGO</div><h1>Livros</h1><p>Consulte o acervo protegido da Biblioteca.</p></div><div class="cabecalho-acoes"><a class="botao principal" th:href="@{/livros/novo}">+ Cadastrar livro</a><span class="selo">Consulta autenticada com JWT</span></div></div>
    <form class="busca" method="get" th:action="@{/livros}"><label>Buscar por título<input type="search" name="titulo" th:value="${titulo}" placeholder="Ex.: Dom Casmurro"></label><label>ISBN<input type="text" name="isbn" th:value="${isbn}" placeholder="978..."></label><label>Nome do autor<input type="search" name="nomeAutor" th:value="${nomeAutor}" placeholder="Ex.: Machado"></label><button class="botao principal" type="submit">Pesquisar</button></form>
    <div th:if="${sucesso != null}" class="sucesso" th:text="${sucesso}"></div>
    <div th:if="${erro != null}" class="erro" th:text="${erro}"></div>
    <section th:if="${resultado != null}" class="tabela-wrap"><div class="sumario"><strong th:text="${resultado.totalElements + ' livro(s) encontrado(s)'}"></strong><small>Resultados fornecidos pela API REST</small></div>
      <table><thead><tr><th>Título</th><th>Autor</th><th>Gênero</th><th>ISBN</th><th>Preço</th></tr></thead><tbody>
        <tr th:each="livro : ${resultado.content}"><td><strong th:text="${livro.titulo}"></strong><small th:text="${livro.dataPublicacao}"></small></td><td th:text="${livro.autor != null ? livro.autor.nome : '—'}"></td><td><span class="tag" th:text="${livro.genero}"></span></td><td th:text="${livro.isbn}"></td><td th:text="${livro.preco != null ? livro.preco : '—'}"></td></tr>
        <tr th:if="${#lists.isEmpty(resultado.content)}"><td colspan="5" class="vazio">Nenhum livro encontrado para os filtros informados.</td></tr>
      </tbody></table>
      <div class="paginacao"><a th:if="${!resultado.first}" th:href="@{/livros(pagina=${paginaAnterior},titulo=${titulo},isbn=${isbn},nomeAutor=${nomeAutor})}">← Anterior</a><span th:text="${'Página ' + (resultado.number + 1) + ' de ' + (resultado.totalPages == 0 ? 1 : resultado.totalPages)}"></span><a th:if="${!resultado.last}" th:href="@{/livros(pagina=${paginaSeguinte},titulo=${titulo},isbn=${isbn},nomeAutor=${nomeAutor})}">Próxima →</a></div>
    </section>
</main>
</body>
</html>
